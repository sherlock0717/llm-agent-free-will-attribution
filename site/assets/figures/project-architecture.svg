<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">项目工程架构</title><desc id="desc">从构念定义到公开页面的六步研究工程链路</desc><rect width="1200" height="430" rx="24" fill="#f4f6fa"/>
  <text x="48" y="58" fill="#172033" font-size="30" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-weight="800">从研究问题到公开交付</text><text x="48" y="92" fill="#5a667f" font-size="18" font-family="Segoe UI, Microsoft YaHei, sans-serif">材料、数据、分析和展示使用同一套字段与质量门禁</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9aa8c2"/></marker></defs>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <g transform="translate(42 150)"><rect width="140" height="126" rx="16" fill="#ffffff" stroke="#315dc9" stroke-width="3"/><text x="18" y="38" fill="#315dc9" font-size="18" font-weight="800">01 构念定义</text><text x="18" y="72" fill="#172033" font-size="16">任务结果</text><text x="18" y="98" fill="#172033" font-size="16">过程证据</text><text x="18" y="122" fill="#172033" font-size="16">主体归因</text></g><path d="M190 213h38" stroke="#9aa8c2" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(234 150)"><rect width="140" height="126" rx="16" fill="#ffffff" stroke="#6945bd" stroke-width="3"/><text x="18" y="38" fill="#6945bd" font-size="18" font-weight="800">02 条件设计</text><text x="18" y="72" fill="#172033" font-size="16">身份</text><text x="18" y="98" fill="#172033" font-size="16">理由与反馈</text><text x="18" y="122" fill="#172033" font-size="16">后续行动</text></g><path d="M382 213h38" stroke="#9aa8c2" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(426 150)"><rect width="140" height="126" rx="16" fill="#ffffff" stroke="#18715a" stroke-width="3"/><text x="18" y="38" fill="#18715a" font-size="18" font-weight="800">03 材料与题项</text><text x="18" y="72" fill="#172033" font-size="16">场景矩阵</text><text x="18" y="98" fill="#172033" font-size="16">原始量尺</text><text x="18" y="122" fill="#172033" font-size="16">预设比较</text></g><path d="M574 213h38" stroke="#9aa8c2" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(618 150)"><rect width="140" height="126" rx="16" fill="#ffffff" stroke="#315dc9" stroke-width="3"/><text x="18" y="38" fill="#315dc9" font-size="18" font-weight="800">04 评分与契约</text><text x="18" y="72" fill="#172033" font-size="16">解析与计分</text><text x="18" y="98" fill="#172033" font-size="16">Schema</text><text x="18" y="122" fill="#172033" font-size="16">来源记录</text></g><path d="M766 213h38" stroke="#9aa8c2" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(810 150)"><rect width="140" height="126" rx="16" fill="#ffffff" stroke="#6945bd" stroke-width="3"/><text x="18" y="38" fill="#6945bd" font-size="18" font-weight="800">05 分析</text><text x="18" y="72" fill="#172033" font-size="16">条件与身份</text><text x="18" y="98" fill="#172033" font-size="16">场景范围</text><text x="18" y="122" fill="#172033" font-size="16">稳健性</text></g><path d="M958 213h38" stroke="#9aa8c2" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(1002 150)"><rect width="156" height="126" rx="16" fill="#ffffff" stroke="#18715a" stroke-width="3"/><text x="18" y="38" fill="#18715a" font-size="18" font-weight="800">06 质量与发布</text><text x="18" y="72" fill="#172033" font-size="16">审计与CI</text><text x="18" y="98" fill="#172033" font-size="16">生成物门禁</text><text x="18" y="122" fill="#172033" font-size="16">Pages展示</text></g>
  </g>
  <rect x="42" y="322" width="1116" height="58" rx="14" fill="#e9eef8"/><text x="600" y="358" text-anchor="middle" fill="#172033" font-size="20" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-weight="700">同一套材料ID、条件ID、场景ID和构念字段贯穿研究、分析、测试与公开页面</text>
</svg>
