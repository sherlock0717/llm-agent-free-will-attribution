<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">项目价值映射</title><desc id="desc">将研究线索连接到现实工程问题与可观察指标</desc><rect width="1200" height="580" rx="24" fill="#ffffff"/><text x="48" y="56" fill="#172033" font-size="30" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-weight="800">研究线索如何转成可评价的系统问题</text>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif"><rect x="48" y="92" width="1104" height="54" rx="12" fill="#172033"/><text x="78" y="126" fill="#ffffff" font-size="18" font-weight="700">研究线索</text><text x="400" y="126" fill="#ffffff" font-size="18" font-weight="700">现实工程问题</text><text x="826" y="126" fill="#ffffff" font-size="18" font-weight="700">可观察指标</text>
    <g transform="translate(48 160)"><rect width="1104" height="82" rx="12" fill="#f4f6fa"/><text x="30" y="34" fill="#315dc9" font-size="18" font-weight="800">过程写法</text><text x="30" y="62" fill="#172033" font-size="16">理由与反馈改变能动性评价</text><text x="352" y="34" fill="#172033" font-size="17">解释更完整，主观可信度可能上升</text><text x="352" y="62" fill="#5a667f" font-size="16">但执行质量需要独立验证</text><text x="778" y="34" fill="#172033" font-size="17">解释—行为一致性</text><text x="778" y="62" fill="#5a667f" font-size="16">工具调用、轨迹与最终状态</text></g>
    <g transform="translate(48 254)"><rect width="1104" height="82" rx="12" fill="#f0ecfb"/><text x="30" y="34" fill="#6945bd" font-size="18" font-weight="800">身份标签</text><text x="30" y="62" fill="#172033" font-size="16">人类标签提高自由意志归因</text><text x="352" y="34" fill="#172033" font-size="17">产品命名影响授权与责任判断</text><text x="352" y="62" fill="#5a667f" font-size="16">助手、代理、同事带来不同预期</text><text x="778" y="34" fill="#172033" font-size="17">接受、复核、覆盖、中止</text><text x="778" y="62" fill="#5a667f" font-size="16">功劳、过错与责任归因</text></g>
    <g transform="translate(48 348)"><rect width="1104" height="82" rx="12" fill="#edf7f1"/><text x="30" y="34" fill="#18715a" font-size="18" font-weight="800">反馈后行为</text><text x="30" y="62" fill="#172033" font-size="16">维持和改变是不同阶段</text><text x="352" y="34" fill="#172033" font-size="17">Agent可能接受反馈却不改变执行</text><text x="352" y="62" fill="#5a667f" font-size="16">计划更新与行动落实需要分开</text><text x="778" y="34" fill="#172033" font-size="17">反馈识别率、计划更新率</text><text x="778" y="62" fill="#5a667f" font-size="16">执行落实率、恢复与回退</text></g>
    <g transform="translate(48 442)"><rect width="1104" height="82" rx="12" fill="#fff8e8"/><text x="30" y="34" fill="#8a5b00" font-size="18" font-weight="800">场景差异</text><text x="30" y="62" fill="#172033" font-size="16">相同方向下仍有幅度变化</text><text x="352" y="34" fill="#172033" font-size="17">平均分可能掩盖高风险任务失败</text><text x="352" y="62" fill="#5a667f" font-size="16">评价要结合权限、后果和人工角色</text><text x="778" y="34" fill="#172033" font-size="17">分场景成功率与恢复成本</text><text x="778" y="62" fill="#5a667f" font-size="16">副作用、回退能力与责任链</text></g>
  </g>
</svg>
