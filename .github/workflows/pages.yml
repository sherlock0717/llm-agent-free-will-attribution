name: Deploy GitHub Pages

# Publishes the combined static showcase to GitHub Pages.
# - root overview source: site/;
# - study B source stays under docs/pa-wu-r1-pilot/ for now;
# - the canonical public route for study B is /machine-decision-process-attribution/;
# - /pa-wu-r1-pilot/ is kept as a compatibility redirect;
# - both are assembled into a temporary _site/ directory during CI by
#   scripts/assemble_pages.py, so local preview and deploy use the same artifact;
# - _site/ is a throwaway deploy directory and is NEVER committed to the repo;
# - deploys only on push to main or manual dispatch;
# - uses the GitHub Actions Pages path (no Jekyll build);
# - contains no API key and runs no real provider request.

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Assemble and deploy project pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble Pages artifact
        run: python scripts/assemble_pages.py --output _site

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
