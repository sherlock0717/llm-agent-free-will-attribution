name: Deploy GitHub Pages

# Publishes the combined research-program site.
# The deployment artifact contains the overview, Research A, Research B, and the
# legacy Research B redirect. Data checks and route tests run before upload.

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate public research pages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Check generated site data
        run: |
          uv run --frozen python scripts/build_site_data.py --check
          uv run --frozen python scripts/build_showcase_data.py --check

      - name: Build Research A scenario analysis and public JSON
        run: >-
          uv run --frozen python scripts/build_research_a_scenario_results.py
          --output "${{ runner.temp }}/research-a-scenario"
          --public-json site/data/research_a_scenario_summary.json

      - name: Validate strict public JSON
        run: uv run --frozen python scripts/check_public_json.py

      - name: Check Study B offline research package
        run: uv run --frozen python scripts/build_study_b_protocol_package.py --check

      - name: Run public site tests
        run: uv run --frozen pytest -q tests/site

      - name: Ruff public build code
        run: >-
          uv run --frozen ruff check
          scripts/assemble_pages.py
          scripts/public_json.py
          scripts/check_public_json.py
          scripts/build_research_a_scenario_results.py
          scripts/build_research_a_v2.py
          scripts/build_study_b_protocol_package.py
          scripts/validate_study_b_external_results.py
          scripts/import_study_b_external_results.py
          scripts/build_study_b_offline_demo.py
          tests/site/test_public_release_gate.py
          tests/site/test_research_a_scenario.py
          tests/site/test_static_site.py
          tests/site/test_study_b_offline_scope.py
          tests/test_study_b_protocol_package.py
          tests/test_study_b_external_import.py

      - name: Assemble Pages artifact
        run: python scripts/assemble_pages.py --output _site

      - name: Validate assembled JSON
        run: >-
          uv run --frozen python scripts/check_public_json.py
          _site/data
          _site/machine-decision-process-attribution/data

      - name: Upload validated Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy project pages
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
