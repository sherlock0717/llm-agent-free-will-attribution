name: Sync portfolio test count once

"on":
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'showcase/final-portfolio-packaging'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out packaging branch
        uses: actions/checkout@v4
        with:
          ref: showcase/final-portfolio-packaging
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Synchronize verified test count
        run: python scripts/_sync_portfolio_test_count_once.py

      - name: Verify portfolio tests
        run: python -m pytest -q tests/site/test_portfolio_packaging.py

      - name: Commit synchronized files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html
          git add site/assets/figures/social-preview.svg
          git add tests/site/test_portfolio_packaging.py
          git add -u -- scripts/_sync_portfolio_test_count_once.py
          git add -u -- .github/workflows/sync_portfolio_test_count_once.yml
          git commit -m "showcase: synchronize verified test count"
          git push origin HEAD:showcase/final-portfolio-packaging
