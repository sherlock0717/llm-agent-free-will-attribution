[project]
# The distribution name is an internal compatibility identifier retained for
# uv.lock and import stability. The public project name is
# "LLM行动者归因评测 (LLM Actor Attribution Evaluation)".
name = "llm-agent-free-will-attribution"
version = "0.2.0.dev0"
description = "LLM行动者归因评测：研究身份标签、决策过程与反馈行为如何影响语言模型的行动者归因反应。"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.66.0",
    "pydantic>=2.12,<3",
    "PyYAML>=6.0,<7",
]

[project.urls]
Homepage = "https://sherlock0717.github.io/llm-attribution-behavior-evaluation/"
Repository = "https://github.com/sherlock0717/llm-attribution-behavior-evaluation"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["freewill_attribution*"]
namespaces = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".venv",
    "artifacts",
    "outputs",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
